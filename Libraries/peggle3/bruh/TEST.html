<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pyodide + CFFI Example</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
<script type="text/javascript">
async function main() {
    pyodide = await loadPyodide();
    await pyodide.loadPackage("cffi");
    const pythonCode = `
import cffi
import asyncio

from pyodide.http import pyfetch
with open("libpeggle3.wasm", "wb") as f:
    f.write(await (await pyfetch("http://localhost:8000/libpeggle3.wasm")).bytes())

ffi = cffi.FFI()

ffi.cdef(\"\"\"
typedef unsigned char uint8_t;
typedef unsigned int  uint32_t;
typedef struct pcre2_code pcre2_code;
typedef struct BRUH_STR { uint8_t *s; uint32_t l; } BRUH_STR;
typedef struct Rule { uint32_t t; uint32_t cL; uint32_t cR; union {BRUH_STR s; pcre2_code* r; } dat; } Rule;
typedef struct Match { uint32_t id,p,l; struct Match *K; uint32_t nK; } Match;

Match* parse(Rule* R, uint32_t Rn, BRUH_STR c, uint32_t id, bool trash);
pcre2_code* create_regex(BRUH_STR P);
\"\"\")

C = ffi.dlopen("libpeggle3.wasm")

# Example usage placeholders
# Create a dummy BRUH_STR string
s = ffi.new("BRUH_STR *", [{'s': ffi.new("uint8_t[]", b"hello"), 'l': 5}])
# Normally you would call C.create_regex(s[0]) etc.
`;

    await pyodide.runPythonAsync(pythonCode);
    console.log("WASM module loaded with CFFI.");
}

main();
</script>
</body>
</html>
